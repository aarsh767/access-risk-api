services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
      POSTGRES_DB: access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access"]
      interval: 2s
      retries: 15
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      # "db" is the Compose service name, not localhost
      DATABASE_URL: postgresql+psycopg2://access:access@db:5432/access
    depends_on:
      db:
        condition: service_healthy
